[project]
name = "facial-recognition"
version = "0.1.0"
description = "IResNet-100 + AdaFace face embedding model (Leonardo / CINECA)"
channels = ["conda-forge"]
platforms = ["linux-64"]

# =============================================================================
# Base dependencies — login node (CPU-only, always installs without CUDA)
# =============================================================================
[dependencies]
python = "3.12.*"
pip = "*"
numpy = ">=1.24"
opencv = ">=4.8"
onnx = "*"
onnxruntime = "*"
scipy = "*"
tensorboard = "*"
tqdm = "*"
huggingface_hub = ">=0.20"

# =============================================================================
# GPU feature — compute node (CUDA-accelerated PyTorch)
# =============================================================================
[feature.gpu]
channels = ["pytorch"]

[feature.gpu.system-requirements]
cuda = "12"

[feature.gpu.dependencies]
pytorch = ">=2.5"
torchvision = "*"
pytorch-cuda = ">=2.5"

# =============================================================================
# Environments
# =============================================================================
[environments]
default = []                # Login node / local dev
gpu = ["gpu"]               # Compute node — 4× A100

# =============================================================================
# Tasks — use with: pixi run -e <env> <task>
# =============================================================================
[tasks]
train = { cmd = "torchrun --standalone --nnodes=1 --nproc_per_node=4 src/train_leonardo.py" }
export = "python src/export.py"
infer = "python src/inference.py"
