[workspace]
name = "facial-recognition"
version = "0.1.0"
description = "IResNet-100 + AdaFace face embedding model (Leonardo / CINECA)"
channels = ["conda-forge"]
platforms = ["linux-64"]

# Use CONDA_OVERRIDE_CUDA=12.0 when running `pixi install` on the login node.
# The login node has no GPU so the __cuda virtual package is absent.
# This override lets pixi solve for CUDA-enabled PyTorch builds anyway.
# The compute nodes have real CUDA drivers and don't need the override.
[system-requirements]
cuda = "12"

[dependencies]
python = "3.11.*"
pytorch-gpu = ">=2.3,<2.8"
torchvision = "*"
numpy = ">=1.24"
opencv = ">=4.8"
onnx = "*"
onnxruntime = "*"
scipy = "*"
tensorboard = "*"
tqdm = "*"

[tasks]
# Single-node, 4-GPU training. --standalone makes torchrun pick a free rendezvous
# port itself (do NOT also set MASTER_ADDR/MASTER_PORT).
train = "torchrun --standalone --nnodes=1 --nproc_per_node=4 src/train_leonardo.py"
export = "python src/export.py"
infer = "python src/inference.py"

[feature.dev.dependencies]
ruff = "*"
ipython = "*"
pytest = "*"

[environments]
default = ["dev"]
